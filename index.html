<body>
<header><h1>สมุดติดตามการเรียน</h1><button class="ib" onclick="openSettings()" aria-label="ตั้งค่า"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button></header>
<main id="app"></main>
<nav>
<button data-v="today" onclick="setView('today')"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>วันนี้</button>

<script>
const DAYS=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
const DS=['จ','อ','พ','พฤ','ศ','ส','อา'];
const COLORS=['#4f46e5','#e11d48','#059669','#d97706','#0891b2','#9333ea','#db2777','#65a30d'];
const KEY='studytracker.v1';
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const DEFPER=[['0','08:00','08:40'],['1','08:40','09:30'],['2','09:30','10:20'],['3','10:20','11:10'],['4','11:10','12:00'],['5','12:00','12:50',1],['6','12:50','13:40'],['7','13:40','14:30'],['8','14:30','15:20'],['9','15:20','16:10']].map(a=>({n:a[0],s:a[1],e:a[2],brk:!!a[3]}));
function blank(){return{periods:DEFPER.map(p=>Object.assign({},p)),subjects:[],slots:[],extras:[],logs:[],notes:[],settings:{notify:false,lead:10,theme:'sea',mode:'auto',imgOn:true,imgZoom:true,imgPin:true,imgMeta:true,pinId:null,pinOpen:true,chkRemind:true,attAuto:true,attWarn:true,attMin:80},images:[],att:{},timer:null,notified:{}}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.subjects))return Object.assign(blank(),d,{settings:Object.assign(blank().settings,d.settings||{})})}catch(e){}return blank()}
let LSOK=true;try{localStorage.setItem('st.t','1');localStorage.removeItem('st.t')}catch(e){LSOK=false}
let S=load();
let _sw=0;function save(){if(!LSOK)return;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){if(!_sw){_sw=1;toast('บันทึกข้อมูลไม่ได้ (พื้นที่เต็ม?)')}}}

/* ---------- date helpers ---------- */
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)};
const weekStart=s=>{const d=pd(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d)};
const today=()=>ymd(new Date());
const fmtDate=(s,o)=>pd(s).toLocaleDateString('th-TH',o||{weekday:'long',day:'numeric',month:'long'});
const tm=s=>{const[h,m]=s.split(':').map(Number);return h*60+m};
const hm=t=>String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');
function fmtMin(m){m=Math.round(m);const h=Math.floor(m/60),r=m%60;if(h&&r)return h+' ชม. '+r+' น.';if(h)return h+' ชม.';return r+' น.'}
const el=ms=>{const s=Math.floor(ms/1000);return[Math.floor(s/3600),Math.floor(s/60)%60,s%60].map(x=>String(x).padStart(2,'0')).join(':')};

/* ---------- data helpers ---------- */
const sub=id=>S.subjects.find(s=>s.id===id)||{id,name:'(ลบวิชาแล้ว)',color:'#94a3b8',goal:0};
const subOpts=sel=>S.subjects.map(s=>`<option value="${s.id}" ${s.id===sel?'selected':''}>${esc(s.name)}</option>`).join('');
function sessionsOn(date){
  const dow=pd(date).getDay();
  const a=S.slots.filter(x=>x.dow===dow).map(x=>({key:'s'+x.id,id:x.id,kind:'s',sub:x.sub,start:x.start,end:x.end,room:x.room||'',teacher:x.teacher||'',date}));
  const b=S.extras.filter(x=>x.date===date).map(x=>({key:'e'+x.id,id:x.id,kind:'e',sub:x.sub,start:x.start,end:x.end,room:x.room||'',teacher:x.teacher||'',date}));
  return a.concat(b).sort((p,q)=>p.start.localeCompare(q.start));
}
function sessInfo(sk){if(!sk)return null;const id=sk.slice(1);return(sk[0]==='s'?S.slots:S.extras).find(x=>x.id===id)||null}
const minsFor=(d,k)=>S.logs.filter(l=>l.date===d&&l.sk===k).reduce((a,l)=>a+l.min,0);
const dayMins=d=>S.logs.filter(l=>l.date===d).reduce((a,l)=>a+l.min,0);
const rangeMins=(a,b)=>S.logs.filter(l=>l.date>=a&&l.date<=b).reduce((t,l)=>t+l.min,0);
function streak(){let d=today(),n=0;if(!dayMins(d))d=addD(d,-1);while(dayMins(d)>0){n++;d=addD(d,-1)}return n}

let view='today',curDate=today(),schedMode='period',schedDate=today(),sumMode='week',sumDate=today();
let noteFilter={q:'',sub:'',pending:false};
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>t.style.display='none',2600)}
function modal(h){const m=$('#modal');m.innerHTML=`<div class="bk" onclick="if(event.target===this)closeM()"><div class="sheet">${h}</div></div>`;m.style.display='block';hydrate(m)}
function ask(msg,fn,label){

  a.innerHTML=`<div class="bk" style="z-index:80;align-items:center;padding:20px" onclick="if(event.target===this)askNo()"><div class="sheet" style="border-radius:18px;max-width:360px;padding:20px"><p style="margin:0 0 4px;font-size:16px;font-weight:600;line-height:1.5">${esc(msg)}</p><div class="acts" style="justify-content:flex-end"><button class="btn o" onclick="askNo()">ยกเลิก</button><button class="btn d" onclick="askYes()">${esc(label||'ตกลง')}</button></div></div></div>`;
}
function askNo(){const a=document.getElementById('ask');if(a)a.innerHTML='';window._askFn=null}
function askYes(){const f=window._askFn;askNo();if(f)f()}
function closeM(){const m=$('#modal');m.style.display='none';m.innerHTML=''}
function setView(v){view=v;render();window.scrollTo(0,0)}

function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));

/* ---------- TODAY ---------- */
function onboarding(){return`<div class="card"><h3 style="margin:0 0 6px">เริ่มต้นใช้งาน 👋</h3><p class="muted" style="margin:0 0 10px">1) เพิ่มวิชา/กิจกรรม &nbsp;2) สร้างตารางเรียน (กดสร้างอัตโนมัติได้) &nbsp;3) จับเวลา + จดโน้ตทุกคาบ</p><div class="acts"><button class="btn" onclick="openSubjects()">+ เพิ่มวิชา</button><button class="btn o" onclick="loadSchool()">โหลดตาราง ม.6/5</button><button class="btn o" onclick="addSample()">ข้อมูลตัวอย่าง</button></div></div>`}
const IC={play:'<svg class="ic" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>',stop:'<svg class="ic" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2.5" fill="currentColor"/></svg>'};
function card(x,nk){
  const s=sub(x.sub),m=minsFor(x.date,x.key),run=S.timer&&S.timer.sk===x.key&&S.timer.date===x.date,nn=S.notes.filter(n=>n.date===x.date&&n.sk===x.key).length;
  let pill='';
  if(x.date===today()){const t=new Date(),nm=t.getHours()*60+t.getMinutes();if(nm>=tm(x.start)&&nm<tm(x.end))pill='<span class="pill now">กำลังเรียน</span>';else if(x.key===nk)pill='<span class="pill">ถัดไป</span>'}
  return`<div class="ss ${run?'run':''}"><div class="tm"><b>${x.start}</b><span>${x.end}</span></div><i class="bar2" style="background:${s.color}"></i>
<div class="mid"><div class="row gap" style="flex-wrap:wrap"><b>${esc(s.name)}</b>${pill}</div><div class="muted sm">${x.teacher?esc(x.teacher)+' · ':''}${x.room?esc(x.room)+' · ':''}${x.kind==='e'?'ครั้งเดียว · ':''}${m?'เรียนแล้ว '+fmtMin(m):'ยังไม่บันทึกเวลา'}${nn?' · โน้ต '+nn:''}</div>
<div class="tl"><button onclick="openLog('${x.sub}','${x.key}','${x.date}')">+ เวลา</button><button onclick="openNote(null,{date:'${x.date}',sk:'${x.key}',sub:'${x.sub}'})">โน้ต</button></div>${attRow(x)}</div>
<button class="go ${run?'stop':''}" aria-label="${run?'หยุด':'เริ่มจับเวลา'}" onclick="${run?'stopTimer()':`startTimer('${x.sub}','${x.key}','${x.date}')`}">${run?IC.stop:IC.play}</button></div>`;
}
function rToday(){
  if(!S.subjects.length)return onboarding();
  const isT=curDate===today(),t=new Date(),nm=t.getHours()*60+t.getMinutes();
  const ss=sessionsOn(curDate),nk=isT?(ss.find(x=>tm(x.start)>nm)||{}).key:null;
  const ws=weekStart(curDate),we=addD(ws,6),wk=rangeMins(ws,we),goal=S.subjects.reduce((a,x)=>a+(x.goal||0),0)*60,free=S.logs.filter(l=>l.date===curDate&&!l.sk);
  return`<div class="hero"><div><small>${fmtDate(curDate,{weekday:'long'})}${isT?' · วันนี้':''}</small><h2>${fmtDate(curDate,{day:'numeric',month:'long'})}</h2></div><div class="nv"><button class="ib" onclick="goD(-1)" aria-label="ก่อนหน้า">‹</button>${isT?'':'<button class="ib" onclick="curDate=today();render()" style="padding:0 12px;font-size:13px;font-weight:600">วันนี้</button>'}<button class="ib" onclick="goD(1)" aria-label="ถัดไป">›</button></div></div>
<div class="st"><div><b>${fmtMin(dayMins(curDate))}</b><span>วันนี้</span></div><div><b>${fmtMin(wk)}</b><span>สัปดาห์นี้</span></div><div><b>${streak()} วัน</b><span>ต่อเนื่อง</span></div></div>
${storageBanner()}${lowWarn()}${goal?`<div class="bar" style="margin:0 0 6px"><i style="width:${Math.min(100,wk/goal*100)}%;background:var(--pri)"></i></div><div class="muted sm" style="margin-bottom:6px">เป้าหมายสัปดาห์ ${Math.round(wk/goal*100)}% · ${fmtMin(wk)} / ${fmtMin(goal)}</div>`:''}
${ss.length?ss.map(x=>card(x,nk)).join(''):`<div class="empty">ไม่มีคาบในวันนี้<div class="acts" style="justify-content:center"><button class="btn s" onclick="openSlot(null,null,{date:'${curDate}'})">+ เพิ่มคาบ</button></div></div>`}
<div class="card"><div class="row between"><b>เรียนนอกตาราง</b><button class="btn s o" onclick="openLog('',null,'${curDate}')">+ บันทึกเวลา</button></div>
${free.map(l=>`<div class="row between li"><span><i class="dot" style="background:${sub(l.sub).color}"></i> ${esc(sub(l.sub).name)} · ${fmtMin(l.min)}</span><button class="lnk" onclick="delLog('${l.id}')">ลบ</button></div>`).join('')||'<div class="muted sm" style="margin-top:6px">ยังไม่มีรายการ</div>'}</div>
<div class="acts"><button class="btn o" style="width:100%" onclick="openNote(null,{date:'${curDate}'})">+ จดโน้ตของวัน</button></div>`;
}

function goDay(d){curDate=d;setView('today')}

function startTimer(sb,sk,date){if(S.timer){toast('มีตัวจับเวลาที่กำลังทำงานอยู่');return}S.timer={sub:sb,sk,date,ts:Date.now()};save();render()}

function rSched(){
  const M=[['period','คาบ'],['week','เวลา'],['list','รายการ'],['month','เดือน']];
  const head=`<div class="seg">${M.map(([k,t])=>`<button class="${schedMode===k?'on':''}" onclick="schedMode='${k}';render()">${t}</button>`).join('')}</div>
<div class="tb" style="flex-wrap:wrap"><button class="btn s o" onclick="openSubjects()">วิชา</button><button class="btn s o" onclick="openAuto()">สร้างอัตโนมัติ</button>${schedMode==='period'?'<button class="btn s o" onclick="openPeriods()">เวลาคาบ</button>':''}${S.settings.imgOn?`<button class="btn s o" onclick="openImages()">ภาพตาราง${S.images.length?' ('+S.images.length+')':''}</button>`:''}<button class="btn s" onclick="openSlot()">+ คาบ</button></div>`;
  return head+pinnedBox()+(schedMode==='period'?periodV():schedMode==='week'?gridV():schedMode==='list'?weekV():monthV());
}
const FULLD=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสฯ','ศุกร์','เสาร์'];
function slotPeriod(x){
  const P=S.periods,a=tm(x.start),b=tm(x.end),f=P.findIndex(p=>a>=tm(p.s)&&a<tm(p.e));
  if(f<0)return null;let l=f;for(let i=f+1;i<P.length;i++){if(tm(P[i].s)<b)l=i;else break}
  return[f,l];
}
function periodV(){
  const P=S.periods,n=new Date(),nm=n.getHours()*60+n.getMinutes(),td=n.getDay();
  const order=[1,2,3,4,5].concat(S.slots.some(x=>x.dow===6)?[6]:[],S.slots.some(x=>x.dow===0)?[0]:[]);
  const cur=P.findIndex(p=>nm>=tm(p.s)&&nm<tm(p.e));
  const ptime=p=>p.s.replace(':','.')+'<br>'+p.e.replace(':','.');
  let h=`<div class="pt"><table class="ptab"><thead><tr><th class="fc">ชั่วโมงที่</th>${P.map((p,i)=>`<th class="eh ${i===cur?'cur':''}" onclick="editPeriod(${i})">${esc(p.n)}</th>`).join('')}</tr><tr><th class="fc">เวลา</th>${P.map((p,i)=>`<th class="tm2 eh" onclick="editPeriod(${i})">${ptime(p)}</th>`).join('')}</tr></thead><tbody>`;
  const other=[];
  order.forEach(d=>{
    const cells=Array(P.length).fill(null),skip=Array(P.length).fill(false);
    S.slots.filter(x=>x.dow===d).sort((a,b)=>a.start.localeCompare(b.start)).forEach(x=>{
      const r=slotPeriod(x);if(!r||cells[r[0]]||skip[r[0]]||P[r[0]].brk){other.push(x);return}
      cells[r[0]]={x,span:r[1]-r[0]+1};for(let i=r[0]+1;i<=r[1];i++)skip[i]=true;
    });
    h+=`<tr class="${d===td?'tr-t':''}"><th class="fc">${FULLD[d]}</th>`;
    P.forEach((p,i)=>{
      if(skip[i])return;
      if(p.brk){h+='<td class="brk">พักเที่ยง</td>';return}
      const c=cells[i];
      if(c){const x=c.x,sb=sub(x.sub),isNow=d===td&&nm>=tm(x.start)&&nm<tm(x.end);
        h+=`<td colspan="${c.span}" onclick="openSlot('s','${x.id}')"><div class="pc ${isNow?'now':''}" style="background:${sb.color}1f;border-color:${sb.color}"><b>${esc(sb.name)}</b>${x.teacher?`<span>${esc(x.teacher)}</span>`:''}${x.room?`<em>${esc(x.room)}</em>`:''}</div></td>`}
      else h+=`<td class="emp" onclick="openSlot(null,null,{dow:${d},start:'${p.s}',end:'${p.e}'})">+</td>`;
    });
    h+='</tr>';
  });
  h+='</tbody></table></div>';
  const empty=!S.slots.length?`<div class="card"><b>ยังไม่มีตาราง</b><p class="muted sm" style="margin:4px 0 0">แตะช่อง + ในตารางเพื่อเพิ่มคาบ หรือโหลดตารางจากรูปที่ให้มา</p><div class="acts"><button class="btn s" onclick="loadSchool()">โหลดตาราง ม.6/5</button><button class="btn s o" onclick="openAuto()">สร้างอัตโนมัติ</button></div></div>`:'';
  const oth=other.length?`<div class="card"><b>คาบที่เวลาไม่ตรงกับช่องคาบ</b>${other.map(x=>`<div class="row between li" onclick="openSlot('s','${x.id}')" style="cursor:pointer"><span><i class="dot" style="background:${sub(x.sub).color}"></i> ${esc(sub(x.sub).name)} · ${FULLD[x.dow]} ${x.start}–${x.end}</span><span class="lnk">แก้ไข</span></div>`).join('')}</div>`:'';
  return empty+h+oth+'<p class="muted sm">แตะเลขคาบหรือเวลาด้านบนเพื่อแก้เวลา · แตะช่องว่างเพื่อเพิ่มคาบ · แตะคาบเพื่อแก้ไข · เลื่อนซ้าย-ขวาเพื่อดูคาบอื่น · คาบแบบครั้งเดียวดูในโหมด "รายการ"</p>';
}
function readPeriods(){return S.periods.map((p,i)=>({n:$('#pn'+i).value.trim()||String(i),s:$('#ps'+i).value||p.s,e:$('#pe'+i).value||p.e,brk:$('#pb'+i).checked}))}

${S.periods.map((p,i)=>`<div class="row gap li"><input id="pn${i}" value="${esc(p.n)}" style="width:48px;margin:0;flex:none;padding:9px 6px;text-align:center"><input type="time" id="ps${i}" value="${p.s}" style="margin:0;min-width:0;padding:9px 6px"><input type="time" id="pe${i}" value="${p.e}" style="margin:0;min-width:0;padding:9px 6px"><label class="row" style="margin:0;gap:3px;color:var(--text);white-space:nowrap"><input type="checkbox" id="pb${i}" style="width:auto;margin:0" ${p.brk?'checked':''}>พัก</label><button class="lnk" onclick="delPeriod(${i})">ลบ</button></div>`).join('')}

function migrate(oldP,newP){
  const mv=[];for(let k=0;k<Math.min(oldP.length,newP.length);k++){const o=oldP[k],n=newP[k];if(o.s!==n.s||o.e!==n.e)S.slots.forEach(x=>{if(x.start===o.s&&x.end===o.e)mv.push([x,n.s,n.e])})}
  mv.forEach(([x,a,b])=>{x.start=a;x.end=b});
}
function editPeriod(i){
  const p=S.periods[i];if(!p)return;
  modal(`<h3>แก้ไขคาบที่ ${esc(p.n)}</h3>
<label>ชื่อ/เลขคาบ<input id="ep_n" value="${esc(p.n)}"></label>
<div class="row gap"><label class="f1">เริ่ม<input type="time" id="ep_s" value="${p.s}"></label><label class="f1">สิ้นสุด<input type="time" id="ep_e" value="${p.e}"></label></div>
<label class="row gap" style="color:var(--text)"><input type="checkbox" id="ep_b" style="width:auto;margin:0" ${p.brk?'checked':''}>เป็นช่วงพัก (ไม่มีเรียน)</label>
<p class="muted sm">วิชาที่อยู่ในคาบนี้จะย้ายตามเวลาใหม่ให้อัตโนมัติ</p>
<div class="acts"><button class="btn" onclick="saveOnePeriod(${i})">บันทึก</button><button class="btn o" onclick="openPeriods()">แก้ทุกคาบ</button><button class="btn d" onclick="delOnePeriod(${i})">ลบคาบ</button></div>`);
}
function saveOnePeriod(i){
  const n=$('#ep_n').value.trim()||String(i),s=$('#ep_s').value,e=$('#ep_e').value;

function gridV(){
  const ws=weekStart(schedDate),days=[0,1,2,3,4,5,6].map(i=>addD(ws,i)),ses=days.map(sessionsOn);
  let lo=8,hi=18;ses.forEach(a=>a.forEach(x=>{lo=Math.min(lo,Math.floor(tm(x.start)/60));hi=Math.max(hi,Math.ceil(tm(x.end)/60))}));
  const PH=46,H=(hi-lo)*PH,n=new Date(),nm=n.getHours()*60+n.getMinutes();
  const nav=`<div class="row between" style="margin:10px 0 8px"><button class="ib" onclick="schedDate=addD(schedDate,-7);render()">‹</button><b>${fmtDate(ws,{day:'numeric',month:'short'})} – ${fmtDate(addD(ws,6),{day:'numeric',month:'short'})}</b><button class="ib" onclick="schedDate=addD(schedDate,7);render()">›</button></div>`;
  const hd=`<div class="tg"><div></div>${days.map((d,i)=>`<div class="tgh ${d===today()?'t':''}" onclick="goDay('${d}')"><span>${DS[i]}</span><b>${pd(d).getDate()}</b></div>`).join('')}</div>`;
  let lab='';for(let h=lo;h<=hi;h++)lab+=`<i style="top:${(h-lo)*PH}px">${h}</i>`;
  const cols=days.map((d,i)=>{
    let b=ses[i].map(x=>{const top=(tm(x.start)-lo*60)/60*PH,ht=Math.max(18,(tm(x.end)-tm(x.start))/60*PH-2),c=sub(x.sub).color;
      return`<div class="blk" style="top:${top}px;height:${ht}px;background:${c}24;border-color:${c}" onclick="openSlot('${x.kind}','${x.id}')"><b>${esc(sub(x.sub).name)}</b>${ht>=36?`<span>${x.start}</span>`:''}</div>`}).join('');
    if(d===today()&&nm>=lo*60&&nm<=hi*60)b+=`<div class="nowl" style="top:${(nm-lo*60)/60*PH}px"></div>`;
    return`<div class="tc" style="height:${H}px;--ph:${PH}px">${b}</div>`}).join('');
  return nav+hd+`<div class="tg" style="margin-top:10px"><div class="tt" style="height:${H}px">${lab}</div>${cols}</div><p class="muted sm">แตะบล็อกเพื่อแก้ไข · แตะวันที่เพื่อดูรายละเอียด</p>`;

function weekV(){
  const ws=weekStart(schedDate);let h=`<div class="row between" style="margin-top:8px"><button class="ib" onclick="schedDate=addD(schedDate,-7);render()">‹</button><b>${fmtDate(ws,{day:'numeric',month:'short'})} – ${fmtDate(addD(ws,6),{day:'numeric',month:'short'})}</b><button class="ib" onclick="schedDate=addD(schedDate,7);render()">›</button></div>`;
  for(let i=0;i<7;i++){
    const d=addD(ws,i),ss=sessionsOn(d);
    h+=`<div class="dayh ${d===today()?'t':''}"><span>${DAYS[pd(d).getDay()]} ${pd(d).getDate()}</span><span><button class="lnk" onclick="goDay('${d}')">ดู ›</button> <button class="lnk" onclick="openSlot(null,null,{date:'${d}'})">+ เพิ่ม</button></span></div>`;
    h+=ss.map(x=>{const m=minsFor(d,x.key);return`<div class="sl" onclick="openSlot('${x.kind}','${x.id}')"><i class="dot" style="background:${sub(x.sub).color}"></i><div class="f1"><b>${esc(sub(x.sub).name)}</b> <span class="muted sm">${x.start}–${x.end}${x.room?' · '+esc(x.room):''}${x.kind==='e'?' · ครั้งเดียว':''}</span></div><span class="sm">${(()=>{const a=attGet(d,x.key);return a?`<span class="tag" style="background:${ATT[a][1]}">${ATT[a][0]}</span> `:''})()}${m?fmtMin(m):''}</span></div>`}).join('')||'<div class="muted sm" style="margin-top:4px">— ว่าง —</div>';
  }

}
function shiftMonth(which,n){const d=pd(which==='s'?schedDate:sumDate);d.setDate(1);d.setMonth(d.getMonth()+n);if(which==='s')schedDate=ymd(d);else sumDate=ymd(d);render()}
function monthV(){
  const d0=pd(schedDate),y=d0.getFullYear(),m=d0.getMonth(),first=new Date(y,m,1),n=new Date(y,m+1,0).getDate(),lead=(first.getDay()+6)%7;
  let h=`<div class="row between" style="margin:8px 0"><button class="ib" onclick="shiftMonth('s',-1)">‹</button><b>${fmtDate(ymd(first),{month:'long',year:'numeric'})}</b><button class="ib" onclick="shiftMonth('s',1)">›</button></div><div class="grid">${DS.map(x=>`<div class="gh">${x}</div>`).join('')}`;
  for(let i=0;i<lead;i++)h+='<div class="cell x"></div>';
  for(let d=1;d<=n;d++){
    const ds=ymd(new Date(y,m,d)),ss=sessionsOn(ds),cols=[...new Set(ss.map(x=>x.sub))].slice(0,4),mm=dayMins(ds);
    h+=`<div class="cell ${ds===today()?'t':''}" onclick="goDay('${ds}')"><b>${d}</b><div class="dots">${cols.map(c=>`<i class="dot" style="background:${sub(c).color}"></i>`).join('')}</div><div class="dots">${ss.map(x=>attGet(ds,x.key)).filter(Boolean).map(k=>`<i class="sq" style="background:${ATT[k][1]}"></i>`).join('')}</div>${mm?`<div class="mm">${(mm/60).toFixed(1)}ชม.</div>`:''}</div>`;
  }
  return h+'</div><p class="muted sm">แตะวันที่เพื่อดูรายละเอียด · จุดกลม = วิชาที่มีเรียน · สี่เหลี่ยม = สถานะเข้าเรียน · ตัวเลข = ชั่วโมงที่เรียนจริง</p>'+attLegend();
}

function saveSlot(ok,oid){
  const sb=$('#f_sub').value,st=$('#f_st').value,en=$('#f_en').value,rm=$('#f_rm').value.trim(),tc=$('#f_tc').value.trim();
  if(!st||!en||tm(en)<=tm(st))return toast('เวลาสิ้นสุดต้องหลังเวลาเริ่ม');
  const nid=oid||uid();
  if(oid){if(ok==='s')S.slots=S.slots.filter(x=>x.id!==oid);else S.extras=S.extras.filter(x=>x.id!==oid);
    const o=ok+oid,n=slotType+nid;if(o!==n){S.logs.forEach(l=>{if(l.sk===o)l.sk=n});S.notes.forEach(l=>{if(l.sk===o)l.sk=n});Object.keys(S.att||{}).forEach(k=>{const i=k.indexOf('|');if(k.slice(i+1)===o){S.att[k.slice(0,i)+'|'+n]=S.att[k];delete S.att[k]}})}}
  if(slotType==='s')S.slots.push({id:nid,sub:sb,dow:+$('#f_dow').value,start:st,end:en,room:rm,teacher:tc});
  else{const dt=$('#f_date').value;if(!dt)return toast('เลือกวันที่');S.extras.push({id:nid,sub:sb,date:dt,start:st,end:en,room:rm,teacher:tc})}

<div class="acts"><button class="btn" onclick="genAuto()">สร้างตาราง</button><button class="btn o" onclick="closeM()">ยกเลิก</button></div>`);

function genAuto(){
  const days=[1,2,3,4,5,6,0].filter(d=>$('#ad'+d).checked),st=tm($('#a_s').value||'16:00'),en=tm($('#a_e').value||'20:00'),len=+$('#a_l').value||60,br=+$('#a_b').value||0;
  if(!days.length)return toast('เลือกอย่างน้อย 1 วัน');if(len<=0||en<=st)return toast('ตรวจสอบช่วงเวลา');
  const per=days.map(()=>{const a=[];for(let t=st;t+len<=en;t+=len+br)a.push(t);return a});
  const maxN=Math.max(0,...per.map(a=>a.length)),order=[];
  for(let i=0;i<maxN;i++)days.forEach((d,j)=>{if(per[j][i]!=null)order.push([d,per[j][i]])});
  const cnt=S.subjects.map(s=>({id:s.id,n:+$('#au_'+s.id).value||0})),need=[];const mx=Math.max(0,...cnt.map(c=>c.n));
  for(let k=0;k<mx;k++)cnt.forEach(c=>{if(k<c.n)need.push(c.id)});
  if(!need.length)return toast('ใส่จำนวนคาบอย่างน้อย 1 วิชา');
  if($('#a_mode').value==='replace')S.slots=[];
  const fit=Math.min(need.length,order.length);
  for(let i=0;i<fit;i++)S.slots.push({id:uid(),sub:need[i],dow:order[i][0],start:hm(order[i][1]),end:hm(order[i][1]+len),room:''});
  save();closeM();schedMode='period';render();
  toast(fit<need.length?`ช่องเวลาไม่พอ จัดได้ ${fit} จาก ${need.length} คาบ`:`สร้างตารางแล้ว ${fit} คาบ`);
}

function refreshNotes(){const e=$('#nlist');if(e)e.innerHTML=noteList()}
function stars(r){return'★'.repeat(r)+'☆'.repeat(5-r)}
function noteList(){
  const q=noteFilter.q.trim().toLowerCase();
  const L=S.notes.filter(n=>(!noteFilter.sub||n.sub===noteFilter.sub)&&(!noteFilter.pending||(n.todo&&!n.done))&&(!q||[n.learned,n.unclear,n.todo].some(t=>(t||'').toLowerCase().includes(q)))).sort((a,b)=>b.date.localeCompare(a.date)||0);
  if(!L.length)return'<div class="empty">ยังไม่มีโน้ต<br>จดสรุปหลังเรียนแต่ละคาบได้ที่หน้า "วันนี้" หรือกด + โน้ต</div>';
  return L.map(n=>{const s=sub(n.sub),si=sessInfo(n.sk);
    return`<div class="card"><div class="row between"><div><span class="tag" style="background:${s.color}">${esc(s.name)}</span> <span class="muted sm">${fmtDate(n.date,{day:'numeric',month:'short'})}${si?' · '+si.start+'–'+si.end:''}</span></div>${n.rate?`<span style="color:#f59e0b">${stars(n.rate)}</span>`:''}</div>
${n.learned?`<div style="margin-top:8px;white-space:pre-wrap">${esc(n.learned)}</div>`:''}
${n.unclear?`<div style="margin-top:6px;white-space:pre-wrap"><span class="muted sm">❓ ไม่เข้าใจ:</span> ${esc(n.unclear)}</div>`:''}
${n.todo?`<label class="row gap" style="margin-top:6px;color:var(--text);align-items:flex-start"><input type="checkbox" style="width:auto;margin:5px 0 0" ${n.done?'checked':''} onchange="toggleTodo('${n.id}')"><span class="${n.done?'muted':'pend'}" style="${n.done?'text-decoration:line-through':''};white-space:pre-wrap">${esc(n.todo)}</span></label>`:''}
<div class="acts"><button class="btn s o" onclick="openNote('${n.id}')">แก้ไข</button></div></div>`}).join('');
}
function toggleTodo(id){const n=S.notes.find(x=>x.id===id);n.done=!n.done;save();refreshNotes()}

function saveNote(id){
  const o={date:$('#n_date').value,sk:$('#n_sk').value||null,sub:$('#n_sub').value,learned:$('#n_l').value.trim(),unclear:$('#n_u').value.trim(),todo:$('#n_t').value.trim(),rate:nr};

/* ---------- SUMMARY ---------- */
function bars(vals,labels,showV){
  const W=320,H=130,mx=Math.max(60,...vals),bw=(W-10)/vals.length;
  return`<svg viewBox="0 0 ${W} ${H+34}" class="chart">`+vals.map((v,i)=>{const h=v/mx*H,x=5+i*bw;
    return`<rect x="${x+bw*.15}" y="${H+14-h}" width="${bw*.7}" height="${v?Math.max(h,2):0}" rx="3" fill="var(--pri)"/>`+
    (showV&&v?`<text x="${x+bw/2}" y="${H+10-h}" text-anchor="middle" font-size="9" fill="var(--text)">${(v/60).toFixed(1)}</text>`:'')+
    (labels[i]?`<text x="${x+bw/2}" y="${H+28}" text-anchor="middle" font-size="9" fill="var(--muted)">${labels[i]}</text>`:'')}).join('')+`<line x1="0" y1="${H+14}" x2="${W}" y2="${H+14}" stroke="var(--line)"/></svg>`;
}
function rSum(){
  if(!S.subjects.length)return onboarding();
  let a,b;
  if(sumMode==='week'){a=weekStart(sumDate);b=addD(a,6)}else{const d=pd(sumDate);a=ymd(new Date(d.getFullYear(),d.getMonth(),1));b=ymd(new Date(d.getFullYear(),d.getMonth()+1,0))}
  const days=[];for(let d=a;d<=b;d=addD(d,1))days.push(d);
  const vals=days.map(dayMins),total=vals.reduce((x,y)=>x+y,0),studied=vals.filter(v=>v>0).length;
  const planned=days.reduce((t,d)=>t+sessionsOn(d).reduce((u,x)=>u+tm(x.end)-tm(x.start),0),0);
  const inPlan=S.logs.filter(l=>l.sk&&l.date>=a&&l.date<=b).reduce((t,l)=>t+l.min,0);
  const labels=sumMode==='week'?DS:days.map((d,i)=>((i+1)%5===0||i===0)?String(i+1):'');
  const title=sumMode==='week'?`${fmtDate(a,{day:'numeric',month:'short'})} – ${fmtDate(b,{day:'numeric',month:'short'})}`:fmtDate(a,{month:'long',year:'numeric'});
  const nav=sumMode==='week'?['sumDate=addD(sumDate,-7);render()','sumDate=addD(sumDate,7);render()']:["shiftMonth('m',-1)","shiftMonth('m',1)"];
  const rows=S.subjects.map(s=>{
    const m=S.logs.filter(l=>l.sub===s.id&&l.date>=a&&l.date<=b).reduce((t,l)=>t+l.min,0),goal=(s.goal||0)*60*days.length/7,p=goal?Math.min(100,m/goal*100):0;
    const rs=S.notes.filter(n=>n.sub===s.id&&n.rate&&n.date>=a&&n.date<=b),av=rs.length?(rs.reduce((t,n)=>t+n.rate,0)/rs.length).toFixed(1):null;
    return`<div class="li"><div class="row between"><span><i class="dot" style="background:${s.color}"></i> <b>${esc(s.name)}</b></span><span class="sm">${fmtMin(m)}${goal?' / '+fmtMin(goal):''}</span></div>${goal?`<div class="bar"><i style="width:${p}%;background:${s.color}"></i></div>`:''}${av?`<div class="muted sm">ความเข้าใจเฉลี่ย ${av}/5 (${rs.length} โน้ต)</div>`:''}</div>`}).join('');
  return`<div class="seg"><button class="${sumMode==='week'?'on':''}" onclick="sumMode='week';render()">สัปดาห์</button><button class="${sumMode==='month'?'on':''}" onclick="sumMode='month';render()">เดือน</button></div>
<div class="row between"><button class="ib" onclick="${nav[0]}">‹</button><b>${title}</b><button class="ib" onclick="${nav[1]}">›</button></div>
<div class="stats"><div><b>${fmtMin(total)}</b><span>รวม</span></div><div><b>${studied} วัน</b><span>วันที่เรียน</span></div><div><b>${studied?fmtMin(total/studied):'-'}</b><span>เฉลี่ย/วัน</span></div></div>
<div class="card"><b>ชั่วโมงเรียนรายวัน</b>${bars(vals,labels,sumMode==='week')}</div>
${planned?`<div class="card"><div class="row between"><b>ทำตามตาราง</b><b>${Math.round(inPlan/planned*100)}%</b></div><div class="bar"><i style="width:${Math.min(100,inPlan/planned*100)}%;background:var(--pri)"></i></div><div class="muted sm" style="margin-top:4px">เรียนตามคาบ ${fmtMin(inPlan)} จากที่วางไว้ ${fmtMin(planned)}</div></div>`:''}
<div class="card"><b>แยกตามวิชา</b> <span class="muted sm">(เทียบเป้าหมาย)</span>${rows}</div>${attCard()}`;
}

function dlBackup(){

  catch(e){toast('ดาวน์โหลดไม่ได้ ใช้ปุ่มคัดลอกแทน')}

async function shareBackup(){
  try{await navigator.share({files:[new File([backupText()],'study-tracker-'+today()+'.json',{type:'application/json'})],title:'สำรองข้อมูลสมุดติดตามการเรียน'})}

/* ---------- attendance ---------- */
const ATT={p:['มา','#16a34a'],l:['สาย','#d97706'],v:['ลา','#2563eb'],a:['ขาด','#dc2626']};
const attGet=(d,k)=>(S.att||{})[d+'|'+k]||'';
const attLegend=()=>`<div class="row gap sm muted" style="flex-wrap:wrap;margin-top:4px">${Object.keys(ATT).map(k=>`<span><i class="sq" style="background:${ATT[k][1]}"></i> ${ATT[k][0]}</span>`).join('')}</div>`;
function attRow(x){
  if(x.date>today())return'<div class="muted sm" style="margin-top:8px">ยังไม่ถึงวัน เช็คเข้าเรียนไม่ได้</div>';
  const cur=attGet(x.date,x.key);
  return`<div class="att">${Object.keys(ATT).map(k=>`<button class="${cur===k?'on':''}" style="${cur===k?'background:'+ATT[k][1]:''}" onclick="setAtt('${x.date}','${x.key}','${k}')">${ATT[k][0]}</button>`).join('')}</div>`;
}
function setAtt(d,k,v){
  if(d>today())return toast('เช็คล่วงหน้าไม่ได้');
  if(!S.att)S.att={};const key=d+'|'+k;
  if(S.att[key]===v){delete S.att[key];v=''}else S.att[key]=v;
  S.logs=S.logs.filter(l=>!(l.date===d&&l.sk===k&&l.src==='attend'));
  if(S.settings.attAuto&&(v==='p'||v==='l')&&!S.logs.some(l=>l.date===d&&l.sk===k)){
    const x=sessionsOn(d).find(q=>q.key===k);if(x)S.logs.push({id:uid(),date:d,sub:x.sub,sk:k,min:tm(x.end)-tm(x.start),src:'attend'});
  }
  save();render();
}
function attStats(){
  const R={};Object.keys(S.att||{}).forEach(key=>{const i=key.indexOf('|'),inf=sessInfo(key.slice(i+1));if(!inf)return;const r=R[inf.sub]||(R[inf.sub]={p:0,l:0,v:0,a:0});if(r[S.att[key]]!=null)r[S.att[key]]++});
  return R;
}
const attTot=r=>r.p+r.l+r.v+r.a;
const attPct=r=>attTot(r)?Math.round((r.p+r.l)/attTot(r)*100):null;
function lowWarn(){
  if(!S.settings.attWarn)return'';const R=attStats(),min=+S.settings.attMin||80;
  const low=S.subjects.filter(x=>{const r=R[x.id];return r&&attTot(r)>=3&&attPct(r)<min});
  if(!low.length)return'';
  return`<div class="card" style="border-color:var(--red)"><b class="pend sm">เข้าเรียนต่ำกว่า ${min}%</b><div class="sm" style="margin-top:4px">${low.map(x=>`${esc(x.name)} ${attPct(R[x.id])}%`).join(' · ')}</div></div>`;
}
function attCard(){
  const R=attStats(),min=+S.settings.attMin||80;
  const rows=S.subjects.filter(x=>R[x.id]).map(x=>{
    const r=R[x.id],pc=attPct(r),low=S.settings.attWarn&&attTot(r)>=3&&pc<min;
    return`<div class="li"><div class="row between"><span><i class="dot" style="background:${x.color}"></i> <b>${esc(x.name)}</b></span><b style="color:${low?'var(--red)':'inherit'}">${pc}%</b></div><div class="bar"><i style="width:${pc}%;background:${low?'var(--red)':'#16a34a'}"></i></div><div class="muted sm" style="margin-top:3px">${Object.keys(ATT).map(k=>ATT[k][0]+' '+r[k]).join(' · ')}${low?` · <span class="pend">ต่ำกว่า ${min}%</span>`:''}</div></div>`}).join('');
  return`<div class="card"><b>การเข้าเรียน (สะสม)</b> <span class="muted sm">เข้าเรียน = มา + สาย · แตะปุ่มซ้ำเพื่อล้างสถานะ</span>${rows||'<div class="muted sm" style="margin-top:6px">ยังไม่มีข้อมูล เช็คได้ที่การ์ดคาบในหน้า "วันนี้" (เปิดวันอื่นเพื่อเช็คย้อนหลัง)</div>'}</div>`;
}
function storageBanner(){return LSOK?'':`<div class="card" style="border-color:var(--red)"><b class="pend sm">ข้อมูลยังไม่ถูกบันทึกถาวร</b><div class="muted sm" style="margin-top:4px">หน้านี้ไม่อนุญาตให้เก็บข้อมูลในเครื่อง (เช่นเปิดในแชต) ข้อมูลจะหายเมื่อปิดหน้า เปิดไฟล์ด้วย Chrome/Safari เพื่อเก็บถาวร หรือกด ตั้งค่า → สำรองข้อมูล</div></div>`}

/* ---------- theme ---------- */
const mq=window.matchMedia?matchMedia('(prefers-color-scheme: dark)'):null;
function applyTheme(){
  const st=S.settings,dark=st.mode==='dark'||(st.mode==='auto'&&mq&&mq.matches),r=document.documentElement;
  r.dataset.theme=st.theme||'sea';r.dataset.mode=dark?'dark':'light';
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=getComputedStyle(r).getPropertyValue('--bg').trim()||'#ffffff';
  try{localStorage.setItem('st.theme',JSON.stringify([r.dataset.theme,st.mode||'auto']))}catch(e){}
}
if(mq&&mq.addEventListener)mq.addEventListener('change',applyTheme);

/* ---------- table images (IndexedDB) ---------- */
let _db;
function idb(){return _db||(_db=new Promise((res,rej)=>{try{const r=indexedDB.open('studytracker-img',1);r.onupgradeneeded=()=>r.result.createObjectStore('imgs',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}}))}
function idbPut(rec){return idb().then(db=>new Promise((res,rej)=>{const t=db.transaction('imgs','readwrite');t.objectStore('imgs').put(rec);t.oncomplete=res;t.onerror=()=>rej(t.error)}))}
function idbGet(id){return idb().then(db=>new Promise((res,rej)=>{const q=db.transaction('imgs').objectStore('imgs').get(id);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}))}
function idbDel(id){return idb().then(db=>new Promise((res,rej)=>{const t=db.transaction('imgs','readwrite');t.objectStore('imgs').delete(id);t.oncomplete=res;t.onerror=()=>rej(t.error)}))}
const URLS={};
function getUrl(id){
  if(URLS[id])return Promise.resolve(URLS[id]);
  return idbGet(id).then(r=>r&&r.blob?(URLS[id]=URL.createObjectURL(r.blob)):null).catch(()=>null).then(u=>{if(u)return u;try{const d=localStorage.getItem('st.img.'+id);if(d)return(URLS[id]=d)}catch(e){}return null});
}
function hydrate(root){
  (root||document).querySelectorAll('img[data-img]').forEach(el=>{
    const id=el.dataset.img;if(el.dataset.done===id)return;el.dataset.done=id;
    getUrl(id).then(u=>{if(u)el.src=u;else{const sp=document.createElement('div');sp.className='muted sm';sp.style.padding='10px 0';sp.textContent='ไม่มีไฟล์ภาพในเครื่องนี้ (อาจนำเข้าจากไฟล์สำรอง) ลบแล้วอัปโหลดใหม่ได้';el.replaceWith(sp)}});
  });
}
function shrink(f,max,q){return new Promise((res,rej)=>{const u=URL.createObjectURL(f),im=new Image();
  im.onload=()=>{const k=Math.min(1,(max||2000)/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/jpeg',q||.85)};
  im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('load'))};im.src=u})}
function blobToDataURL(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(b)})}
async function putImg(id,blob){
  URLS[id]=URL.createObjectURL(blob);
  try{await idbPut({id,blob});return'idb'}catch(e){}
  try{let u=await blobToDataURL(blob);if(u.length>1500000)u=await blobToDataURL(await shrink(blob,1400,.7));localStorage.setItem('st.img.'+id,u);return'ls'}catch(e){}
  return'mem';
}
async function uploadImgs(inp){
  const files=[...inp.files];let n=0,bad=0,mem=0;
  for(const f of files){
    if(f.type&&!f.type.startsWith('image/')){bad++;continue}
    let blob;try{blob=await shrink(f)}catch(e){bad++;continue}
    const id=uid(),mode=await putImg(id,blob);if(mode==='mem')mem++;
    S.images.push({id,name:(f.name||'').replace(/\.[^.]+$/,'')||'ภาพตาราง',note:'',ts:Date.now()});n++;
    if(S.settings.imgPin&&!S.settings.pinId)S.settings.pinId=id;
  }
  try{inp.value=''}catch(e){}
  save();render();openImages();
  toast(!n?'อ่านไฟล์ภาพไม่ได้ ลองใช้ JPG หรือ PNG (ไฟล์ HEIC บางเครื่องไม่รองรับ)':`อัปโหลด ${n} ภาพแล้ว`+(bad?` (ข้าม ${bad})`:'')+(mem?' · เก็บได้ชั่วคราวเท่านั้น เปิดไฟล์ด้วย Chrome/Safari เพื่อเก็บถาวร':''));
}
function openImages(){
  const st=S.settings;
  modal(`<h3>ภาพตาราง</h3><p class="muted sm" style="margin:0">ใช้เป็นต้นแบบดูอ้างอิงตอนกรอกตาราง · เก็บในเครื่องนี้เท่านั้น ย่อขนาดให้อัตโนมัติ</p>
${S.images.length?S.images.map(im=>`<div class="gi"><img class="gimg" data-img="${im.id}" onclick="viewImg('${im.id}')" alt="${esc(im.name)}">
<div class="row between" style="margin-top:8px;gap:8px"><div class="f1" style="min-width:0"><b>${esc(im.name)}</b>${st.pinId===im.id&&st.imgPin?' <span class="pill">ปักอยู่</span>':''}${st.imgMeta&&im.note?`<div class="muted sm">${esc(im.note)}</div>`:''}</div></div>
<div class="acts" style="margin-top:8px"><button class="btn s o" onclick="viewImg('${im.id}')">${st.imgZoom?'ดูเต็มจอ':'ดู'}</button>${st.imgPin?`<button class="btn s o" onclick="pinImg('${im.id}')">${st.pinId===im.id?'เลิกปัก':'ปักเหนือตาราง'}</button>`:''}${st.imgMeta?`<button class="btn s o" onclick="editImg('${im.id}')">ชื่อ/โน้ต</button>`:''}<button class="btn s d" onclick="delImg('${im.id}')">ลบ</button></div></div>`).join(''):'<div class="empty">ยังไม่มีภาพ<br>อัปโหลดรูปตารางเรียนของโรงเรียนไว้ดูอ้างอิงได้</div>'}
<div class="acts"><label class="btn fbtn">+ อัปโหลดภาพ<input type="file" id="imgf" accept="image/*" multiple onchange="uploadImgs(this)"></label><button class="btn o" onclick="closeM()">ปิด</button></div>`);
}
function pinImg(id){S.settings.pinId=S.settings.pinId===id?null:id;save();render();openImages()}
function editImg(id){
  const im=S.images.find(x=>x.id===id);if(!im)return;
  modal(`<h3>ชื่อ/โน้ตของภาพ</h3><label>ชื่อภาพ<input id="im_n" value="${esc(im.name)}"></label><label>โน้ต (ไม่บังคับ)<textarea id="im_t" rows="3">${esc(im.note)}</textarea></label>
<div class="acts"><button class="btn" onclick="saveImg('${id}')">บันทึก</button><button class="btn o" onclick="openImages()">กลับ</button></div>`);
}
function saveImg(id){const im=S.images.find(x=>x.id===id);if(!im)return;im.name=$('#im_n').value.trim()||'ภาพตาราง';im.note=$('#im_t').value.trim();save();render();openImages()}
function delImg(id){
  const im=S.images.find(x=>x.id===id);if(!im)return;
  ask(`ลบภาพ "${im.name}"? (ไม่กระทบตารางที่กรอกไว้)`,()=>{
    idbDel(id).catch(()=>{});try{localStorage.removeItem('st.img.'+id)}catch(e){}if(URLS[id]){URL.revokeObjectURL(URLS[id]);delete URLS[id]}
    S.images=S.images.filter(x=>x.id!==id);if(S.settings.pinId===id)S.settings.pinId=null;
    save();render();openImages();toast('ลบภาพแล้ว');
  },'ลบ');
}
function pinnedBox(){
  const st=S.settings;if(!st.imgOn||!st.imgPin||!st.pinId)return'';
  const im=S.images.find(x=>x.id===st.pinId);if(!im)return'';
  const open=st.pinOpen!==false;
  return`<div class="card" style="margin-top:2px"><div class="row between"><b class="sm">ภาพต้นแบบ · ${esc(im.name)}</b><span><button class="lnk" onclick="togglePin()">${open?'ซ่อน':'แสดง'}</button> &nbsp;<button class="lnk" onclick="openImages()">จัดการ</button></span></div>${open?`<img class="pinimg" data-img="${im.id}" onclick="viewImg('${im.id}')" alt="${esc(im.name)}">${st.imgMeta&&im.note?`<div class="muted sm" style="margin-top:6px">${esc(im.note)}</div>`:''}`:''}</div>`;
}
function togglePin(){S.settings.pinOpen=S.settings.pinOpen===false;save();render()}

/* viewer with pinch / wheel / double-tap zoom */
let VZ={s:1,x:0,y:0,ptr:{},d0:0,s0:1,lt:0};
function applyV(){const i=$('#vimg');if(i)i.style.transform=`translate(${VZ.x}px,${VZ.y}px) scale(${VZ.s})`;const pc=$('#vpct');if(pc)pc.textContent=Math.round(VZ.s*100)+'%'}
function setZ(v){VZ.s=Math.max(1,Math.min(6,v));if(VZ.s===1){VZ.x=0;VZ.y=0}applyV()}
function vzoom(f){setZ(VZ.s*f)}
function vreset(){VZ.s=1;VZ.x=0;VZ.y=0;applyV()}
function closeViewer(){const v=$('#viewer');v.style.display='none';v.innerHTML=''}
function viewImg(id){
  const im=S.images.find(x=>x.id===id);if(!im)return;
  const zoom=S.settings.imgZoom!==false;VZ={s:1,x:0,y:0,ptr:{},d0:0,s0:1,lt:0};
  const v=$('#viewer');
  v.innerHTML=`<div class="vtop"><b style="font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(im.name)}</b><button class="ib" onclick="closeViewer()" aria-label="ปิด">✕</button></div><div class="vstage" id="vst"><img data-img="${id}" id="vimg" draggable="false" alt=""></div>${zoom?`<div class="vbar"><button onclick="vzoom(1/1.4)" aria-label="ซูมออก">−</button><button onclick="vreset()" id="vpct">100%</button><button onclick="vzoom(1.4)" aria-label="ซูมเข้า">+</button></div>`:''}${S.settings.imgMeta&&im.note?`<div class="vnote">${esc(im.note)}</div>`:''}`;
  v.style.display='flex';hydrate(v);
  if(!zoom)return;
  const st=$('#vst');
  st.addEventListener('pointerdown',e=>{try{st.setPointerCapture(e.pointerId)}catch(x){}VZ.ptr[e.pointerId]={x:e.clientX,y:e.clientY};const ks=Object.keys(VZ.ptr);if(ks.length===2){const[a,b]=Object.values(VZ.ptr);VZ.d0=Math.hypot(a.x-b.x,a.y-b.y);VZ.s0=VZ.s}else{VZ.t0=Date.now();VZ.sx=e.clientX;VZ.sy=e.clientY}});
  st.addEventListener('pointermove',e=>{const q=VZ.ptr[e.pointerId];if(!q)return;const ks=Object.keys(VZ.ptr);
    if(ks.length===2){q.x=e.clientX;q.y=e.clientY;const[a,b]=Object.values(VZ.ptr);if(VZ.d0)setZ(VZ.s0*Math.hypot(a.x-b.x,a.y-b.y)/VZ.d0)}
    else if(VZ.s>1){VZ.x+=e.clientX-q.x;VZ.y+=e.clientY-q.y;q.x=e.clientX;q.y=e.clientY;applyV()}else{q.x=e.clientX;q.y=e.clientY}});
  const up=e=>{const n=Object.keys(VZ.ptr).length;delete VZ.ptr[e.pointerId];VZ.d0=0;
    if(n===1&&e.type==='pointerup'&&Date.now()-VZ.t0<250&&Math.hypot(e.clientX-VZ.sx,e.clientY-VZ.sy)<8){const t=Date.now();if(t-VZ.lt<320){VZ.lt=0;VZ.s>1?vreset():setZ(2.5)}else VZ.lt=t}};
  st.addEventListener('pointerup',up);st.addEventListener('pointercancel',up);
  st.addEventListener('wheel',e=>{e.preventDefault();setZ(VZ.s*(e.deltaY<0?1.15:1/1.15))},{passive:false});
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const v=$('#viewer');if(v&&v.style.display==='flex')closeViewer()}});

/* ---------- PWA ---------- */
let DIP=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();DIP=e});
window.addEventListener('appinstalled',()=>{DIP=null;toast('ติดตั้งแอปแล้ว')});
const isStandalone=()=>(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
function installBox(){
  const web=/^https?:$/.test(location.protocol),ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  let body;
  if(isStandalone())body='<span class="muted sm">กำลังใช้งานแบบแอปที่ติดตั้งแล้ว</span>';
  else if(!web)body='<span class="muted sm">ต้องเปิดผ่านเว็บ (https) ก่อนถึงจะติดตั้งเป็นแอปได้ ดูวิธีในไฟล์ README</span>';
  else if(DIP)body='<button class="btn s" onclick="doInstall()">ติดตั้งแอป</button>';
  else if(ios)body='<span class="muted sm">iPhone/iPad: กดปุ่มแชร์ใน Safari แล้วเลือก "เพิ่มไปยังหน้าจอโฮม"</span>';
  else body='<span class="muted sm">เปิดเมนูของเบราว์เซอร์ แล้วเลือก "ติดตั้งแอป" หรือ "เพิ่มลงหน้าจอหลัก"</span>';
  return`<b class="sm" style="display:block;margin-top:16px">ติดตั้งแอป</b><div style="margin-top:6px">${body}</div>`;
}
async function doInstall(){if(!DIP)return;DIP.prompt();try{await DIP.userChoice}catch(e){}DIP=null;openSettings()}
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  const had=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').catch(()=>{});
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had)toast('อัปเดตแล้ว ปิดแล้วเปิดแอปใหม่เพื่อใช้เวอร์ชันล่าสุด')});
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
}

/* ---------- notifications / tick ---------- */
function pushNote(title,msg){toast(msg);try{if('Notification' in window&&Notification.permission==='granted')new Notification(title,{body:msg})}catch(e){}}
function notifyStart(now){
  const d=ymd(now),nm=now.getHours()*60+now.getMinutes();
  sessionsOn(d).forEach(x=>{
    const t=tm(x.start)-nm,k=d+x.key;
    if(t>=0&&t<=S.settings.lead&&!S.notified[k]){S.notified[k]=1;save();pushNote('ใกล้ถึงคาบเรียน',sub(x.sub).name+' เริ่ม '+x.start+(x.room?' · '+x.room:''))}
  });
}
function notifyCheck(now){
  const d=ymd(now),nm=now.getHours()*60+now.getMinutes();
  sessionsOn(d).forEach(x=>{
    const t=nm-tm(x.end),k=d+'c'+x.key;
    if(t>=0&&t<=45&&!attGet(d,x.key)&&!S.notified[k]){S.notified[k]=1;save();pushNote('เช็คเข้าเรียน',sub(x.sub).name+' จบคาบแล้ว อย่าลืมเช็คเข้าเรียน')}
  });
}
function tick(){
  if(S.timer){const e=$('#tel');if(e)e.textContent=el(Date.now()-S.timer.ts)}
  const now=new Date();
  if(S.settings.notify)notifyStart(now);
  if(S.settings.chkRemind)notifyCheck(now);
}
(function init(){
  applyTheme();try{const vp=new URLSearchParams(location.search).get('v');if(['today','sched','notes','sum'].includes(vp))view=vp}catch(e){}const t=today();Object.keys(S.notified||{}).forEach(k=>{if(!k.startsWith(t))delete S.notified[k]});
  render();setInterval(tick,1000);
})();
</script>
